<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Passwortgenerator</title>
<style>
  :root {
    --bg-1: #1e1b4b;
    --bg-2: #4c1d95;
    --card-bg: rgba(255, 255, 255, 0.08);
    --card-border: rgba(255, 255, 255, 0.15);
    --text: #f1f5f9;
    --text-muted: #b8b8d1;
    --accent: #8b5cf6;
    --accent-hover: #7c3aed;
    --success: #22c55e;
    --error: #f87171;
    --input-bg: rgba(0, 0, 0, 0.25);
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: linear-gradient(135deg, var(--bg-1), var(--bg-2));
    color: var(--text);
  }

  .card {
    width: 100%;
    max-width: 440px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 32px;
    backdrop-filter: blur(16px);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
  }

  h1 {
    margin: 0 0 4px;
    font-size: 1.6rem;
    text-align: center;
  }

  .subtitle {
    margin: 0 0 28px;
    text-align: center;
    color: var(--text-muted);
    font-size: 0.9rem;
  }

  .output-row {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }

  #passwordOutput {
    flex: 1;
    min-width: 0;
    padding: 14px 16px;
    font-size: 1.05rem;
    font-family: 'Consolas', 'Courier New', monospace;
    border-radius: 12px;
    border: 1px solid var(--card-border);
    background: var(--input-bg);
    color: var(--text);
    letter-spacing: 0.5px;
  }

  .icon-btn {
    flex-shrink: 0;
    width: 50px;
    border-radius: 12px;
    border: 1px solid var(--card-border);
    background: var(--input-bg);
    color: var(--text);
    font-size: 1.2rem;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
  }

  .icon-btn:hover {
    background: rgba(255, 255, 255, 0.15);
  }

  .icon-btn:active {
    transform: scale(0.95);
  }

  .field-group {
    margin-bottom: 18px;
  }

  label {
    display: block;
    margin-bottom: 8px;
    font-size: 0.9rem;
    color: var(--text-muted);
  }

  .length-row {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  input[type="range"] {
    flex: 1;
    accent-color: var(--accent);
    cursor: pointer;
  }

  input[type="number"] {
    width: 64px;
    padding: 8px;
    text-align: center;
    border-radius: 8px;
    border: 1px solid var(--card-border);
    background: var(--input-bg);
    color: var(--text);
    font-size: 1rem;
  }

  .checkbox-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 22px;
  }

  .checkbox-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    background: var(--input-bg);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    cursor: pointer;
    user-select: none;
    font-size: 0.9rem;
    transition: border-color 0.2s;
  }

  .checkbox-item:hover {
    border-color: var(--accent);
  }

  .checkbox-item input {
    accent-color: var(--accent);
    width: 16px;
    height: 16px;
    cursor: pointer;
  }

  .generate-btn {
    width: 100%;
    padding: 14px;
    font-size: 1rem;
    font-weight: 600;
    border: none;
    border-radius: 12px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
  }

  .generate-btn:hover {
    background: var(--accent-hover);
  }

  .generate-btn:active {
    transform: scale(0.98);
  }

  .message {
    min-height: 20px;
    margin-top: 14px;
    text-align: center;
    font-size: 0.85rem;
  }

  .message.error {
    color: var(--error);
  }

  .message.success {
    color: var(--success);
  }

  .strength {
    margin-top: 14px;
  }

  .strength-bar {
    height: 6px;
    border-radius: 4px;
    background: rgba(255, 255, 255, 0.15);
    overflow: hidden;
  }

  .strength-fill {
    height: 100%;
    width: 0%;
    border-radius: 4px;
    transition: width 0.3s ease, background 0.3s ease;
  }

  .strength-label {
    margin-top: 6px;
    font-size: 0.8rem;
    color: var(--text-muted);
    text-align: right;
  }

  @media (max-width: 480px) {
    .card {
      padding: 24px 20px;
    }

    .checkbox-grid {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>
<body>

<div class="card">
  <h1>🔐 Passwortgenerator</h1>
  <p class="subtitle">Erstelle sichere, individuelle Passwörter</p>

  <div class="output-row">
    <input type="text" id="passwordOutput" readonly placeholder="Dein Passwort erscheint hier">
    <button class="icon-btn" id="copyBtn" title="In Zwischenablage kopieren">📋</button>
  </div>

  <div class="field-group">
    <label for="lengthInput">Passwortlänge: <span id="lengthValue">16</span></label>
    <div class="length-row">
      <input type="range" id="lengthSlider" min="4" max="64" value="16">
      <input type="number" id="lengthInput" min="4" max="64" value="16">
    </div>
  </div>

  <div class="field-group">
    <label>Zeichenarten</label>
    <div class="checkbox-grid">
      <label class="checkbox-item">
        <input type="checkbox" id="uppercase" checked>
        Großbuchstaben (A-Z)
      </label>
      <label class="checkbox-item">
        <input type="checkbox" id="lowercase" checked>
        Kleinbuchstaben (a-z)
      </label>
      <label class="checkbox-item">
        <input type="checkbox" id="numbers" checked>
        Zahlen (0-9)
      </label>
      <label class="checkbox-item">
        <input type="checkbox" id="symbols">
        Sonderzeichen (!@#$…)
      </label>
    </div>
  </div>

  <button class="generate-btn" id="generateBtn">Passwort generieren</button>

  <div class="message" id="message"></div>

  <div class="strength">
    <div class="strength-bar">
      <div class="strength-fill" id="strengthFill"></div>
    </div>
    <div class="strength-label" id="strengthLabel"></div>
  </div>
</div>

<script>
  const MIN_LENGTH = 4;
  const MAX_LENGTH = 64;

  const CHAR_SETS = {
    uppercase: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
    lowercase: 'abcdefghijklmnopqrstuvwxyz',
    numbers: '0123456789',
    symbols: '!@#$%^&*()_+-=[]{}|;:,.<>?'
  };

  const lengthSlider = document.getElementById('lengthSlider');
  const lengthInput = document.getElementById('lengthInput');
  const lengthValue = document.getElementById('lengthValue');
  const uppercaseCb = document.getElementById('uppercase');
  const lowercaseCb = document.getElementById('lowercase');
  const numbersCb = document.getElementById('numbers');
  const symbolsCb = document.getElementById('symbols');
  const generateBtn = document.getElementById('generateBtn');
  const copyBtn = document.getElementById('copyBtn');
  const passwordOutput = document.getElementById('passwordOutput');
  const messageEl = document.getElementById('message');
  const strengthFill = document.getElementById('strengthFill');
  const strengthLabel = document.getElementById('strengthLabel');

  function syncLength(value) {
    let clamped = Math.min(MAX_LENGTH, Math.max(MIN_LENGTH, Number(value) || MIN_LENGTH));
    lengthSlider.value = clamped;
    lengthInput.value = clamped;
    lengthValue.textContent = clamped;
    return clamped;
  }

  lengthSlider.addEventListener('input', () => syncLength(lengthSlider.value));
  lengthInput.addEventListener('input', () => syncLength(lengthInput.value));
  lengthInput.addEventListener('blur', () => syncLength(lengthInput.value));

  function showMessage(text, type) {
    messageEl.textContent = text;
    messageEl.className = 'message' + (type ? ' ' + type : '');
  }

  function getRandomInt(max) {
    const array = new Uint32Array(1);
    crypto.getRandomValues(array);
    return array[0] % max;
  }

  function generatePassword() {
    const length = syncLength(lengthInput.value);

    if (length < MIN_LENGTH || length > MAX_LENGTH) {
      showMessage(`Bitte eine Länge zwischen ${MIN_LENGTH} und ${MAX_LENGTH} Zeichen wählen.`, 'error');
      return;
    }

    const activeSets = [];
    if (uppercaseCb.checked) activeSets.push(CHAR_SETS.uppercase);
    if (lowercaseCb.checked) activeSets.push(CHAR_SETS.lowercase);
    if (numbersCb.checked) activeSets.push(CHAR_SETS.numbers);
    if (symbolsCb.checked) activeSets.push(CHAR_SETS.symbols);

    if (activeSets.length === 0) {
      showMessage('Bitte mindestens eine Zeichenart auswählen.', 'error');
      passwordOutput.value = '';
      updateStrength('');
      return;
    }

    const allChars = activeSets.join('');
    const passwordChars = [];

    activeSets.forEach(set => {
      passwordChars.push(set[getRandomInt(set.length)]);
    });

    for (let i = passwordChars.length; i < length; i++) {
      passwordChars.push(allChars[getRandomInt(allChars.length)]);
    }

    for (let i = passwordChars.length - 1; i > 0; i--) {
      const j = getRandomInt(i + 1);
      [passwordChars[i], passwordChars[j]] = [passwordChars[j], passwordChars[i]];
    }

    const password = passwordChars.join('');
    passwordOutput.value = password;
    showMessage('Passwort erfolgreich generiert.', 'success');
    updateStrength(password, activeSets.length);
  }

  function updateStrength(password, varietyCount) {
    if (!password) {
      strengthFill.style.width = '0%';
      strengthFill.style.background = 'transparent';
      strengthLabel.textContent = '';
      return;
    }

    const score = Math.min(100, Math.round((password.length / MAX_LENGTH) * 60 + (varietyCount || 1) * 10));
    let color = '#f87171';
    let label = 'Schwach';

    if (score >= 75) {
      color = '#22c55e';
      label = 'Stark';
    } else if (score >= 45) {
      color = '#facc15';
      label = 'Mittel';
    }

    strengthFill.style.width = score + '%';
    strengthFill.style.background = color;
    strengthLabel.textContent = label;
  }

  async function copyPassword() {
    if (!passwordOutput.value) {
      showMessage('Kein Passwort zum Kopieren vorhanden.', 'error');
      return;
    }
    try {
      await navigator.clipboard.writeText(passwordOutput.value);
      showMessage('Passwort in die Zwischenablage kopiert!', 'success');
    } catch (err) {
      passwordOutput.select();
      document.execCommand('copy');
      showMessage('Passwort kopiert.', 'success');
    }
  }

  generateBtn.addEventListener('click', generatePassword);
  copyBtn.addEventListener('click', copyPassword);

  syncLength(lengthInput.value);
  generatePassword();
</script>

</body>
</html>
